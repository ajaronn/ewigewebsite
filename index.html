<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scrolle nach unten, unten kommt das was ich dir sagen will!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400&display=swap');
  html,body{margin:0;padding:0;background:#000;overscroll-behavior:none}
  *{scrollbar-width:none} *::-webkit-scrollbar{display:none}
 .line{
    font-family:'Geist Mono',monospace; font-weight:300;
    font-size:clamp(1.15rem,3.8vw,2.6rem); line-height:1.1;
    text-align:center; padding:1.35rem 1rem;
    border-bottom:1px solid rgba(255,255,255,0.07);
    color:rgba(255,255,255,0.92); letter-spacing:-0.035em;
    transition:background 220ms ease,letter-spacing 420ms cubic-bezier(0.16,1,0.3,1);
    user-select:none;
  }
 .line:hover{background:rgba(255,255,255,0.07); letter-spacing:0.12em; color:#fff}
</style>
</head>
<body>
  <div id="container"></div>
  <div id="sentinel" style="height:1px"></div>
  <div style="height:40vh"></div>
<script>
  const container=document.getElementById('container');
  const sentinel=document.getElementById('sentinel');
  const BATCH=150;
  function addLines(n){
    const frag=document.createDocumentFragment();
    for(let i=0;i<n;i++){
      const d=document.createElement('div');
      d.className='line'; d.textContent='scrolle nach unten!';
      frag.appendChild(d);
    }
    container.appendChild(frag);
  }
  addLines(450);
  new IntersectionObserver(e=>{ if(e[0].isIntersecting) addLines(BATCH); },
    {rootMargin:'1200px'}).observe(sentinel);
</script>
</body>
</html>
