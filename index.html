<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unendlich</title>
<style>
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: monospace;
    font-size: 22px;
    line-height: 1;
  }
 .line {
    padding: 18px 0;
    text-align: center;
    border-bottom: 1px solid #0a0a0a;
    will-change: transform;
  }
  #sentinel { height: 1px; }
</style>
</head>
<body>
<div id="list"></div>
<div id="sentinel"></div>

<script>
  const list = document.getElementById('list');
  const sentinel = document.getElementById('sentinel');

  function addLines(n) {
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = 'scrolle nach unten!';
      frag.appendChild(div);
    }
    list.appendChild(frag);
  }

  // Start mit 200 Zeilen damit man direkt scrollen kann
  addLines(200);

  // Der Trick für echtes unendlich ohne Springen: IntersectionObserver
  const observer = new IntersectionObserver((entries) => {
    if (entries[0].isIntersecting) {
      addLines(100);
    }
  }, { rootMargin: '1000px' });

  observer.observe(sentinel);
</script>
</body>
</html>
