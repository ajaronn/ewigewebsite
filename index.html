<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesen! Die Nachricht ist wichtig</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: monospace; }
  .line { 
    text-align: center; 
    padding: 24px 20px; 
    font-size: 22px; 
    border-bottom: 1px solid #222; 
    max-width: 700px; 
    margin: 0 auto; 
    line-height: 1.3;
    word-wrap: break-word;
    white-space: normal;
  }
</style>
</head>
<body>
<div id="list"></div>
<script>
  const list = document.getElementById('list');
  function add(n) {
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'line';
      d.textContent = 'scrolle nach unten, unten kommt das was ich dir sagen will!';
      list.appendChild(d);
    }
  }
  add(100);
  window.addEventListener('scroll', () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
      add(100);
    }
  });
</script>
</body>
</html>
